<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self';">
    <title>Kindle 閱讀筆記管理系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部導覽列 -->
    <header class="navbar">
        <div class="header-container">
            <div class="brand-group">
                <h1>Kindle 筆記管理</h1>
                <nav class="tab-nav">
                    <button type="button" class="tab-btn active" data-tab="clippingsTab">標註與筆記</button>
                    <button type="button" class="tab-btn" data-tab="booksTab">書籍心得清單</button>
                </nav>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋書籍、作者、筆記或內文...">
            </div>
        </div>
    </header>

    <!-- 主版面內容 -->
    <main class="main-layout">
        <!-- 標註與筆記分頁 -->
        <section id="clippingsTab" class="tab-content active">
            <div class="tab-inner-layout">
                <!-- 左側邊欄 -->
                <aside class="sidebar">
                    <!-- 檔案匯入區塊 -->
                    <div class="upload-section">
                        <h3>匯入標註檔案</h3>
                        <div class="drop-zone" id="dropZone">
                            <p>拖放 My Clippings.txt 至此</p>
                            <span>或</span>
                            <label class="upload-btn" for="fileInput">選取檔案</label>
                            <input type="file" id="fileInput" accept=".txt" class="hidden-file-input">
                        </div>

                        <!-- 書籍解析模式選單 -->
                        <div class="format-select-group">
                            <label for="formatSelect">書籍解析模式：</label>
                            <select id="formatSelect" class="format-select">
                                <option value="kfx" selected>新格式 (KFX)</option>
                                <option value="legacy">舊版 (AZW3, MOBI)</option>
                            </select>
                        </div>

                        <div class="upload-status" id="uploadStatus"></div>
                    </div>

                    <!-- 條件篩選區塊 -->
                    <div class="filter-section">
                        <h3>篩選過濾</h3>
                        <div class="filter-group">
                            <label for="startDateInput">開始日期</label>
                            <input type="date" id="startDateInput">
                        </div>
                        <div class="filter-group">
                            <label for="endDateInput">結束日期</label>
                            <input type="date" id="endDateInput">
                        </div>
                        <div class="filter-group-inline">
                            <input type="checkbox" id="starredOnlyCheckbox">
                            <label for="starredOnlyCheckbox">只看已加星號 (★)</label>
                        </div>
                        <div class="filter-group-inline">
                            <input type="checkbox" id="hasNotesOnlyCheckbox">
                            <label for="hasNotesOnlyCheckbox">只看有筆記的標註 (💡)</label>
                        </div>
                        <button type="button" id="clearFiltersBtn" class="btn-secondary btn-reset-filters">重設篩選條件</button>
                    </div>

                    <!-- 書籍分類清單 -->
                    <div class="books-section">
                        <h3>書籍分類 (<span id="totalBooksCount">0</span>)</h3>
                        <ul class="book-list" id="bookList">
                            <!-- 由 JavaScript 動態生成書籍清單 -->
                        </ul>
                    </div>

                    <!-- 資料庫管理區塊 -->
                    <div class="database-section">
                        <h3>資料庫備份與還原</h3>
                        <div class="db-actions-vertical">
                            <button type="button" id="backupDbBtn" class="btn-secondary">備份資料庫 (.db)</button>
                            <label for="restoreDbFileInput" class="btn-secondary btn-file-label">還原資料庫</label>
                            <input type="file" id="restoreDbFileInput" accept=".db,.sqlite" class="hidden-file-input">
                        </div>
                        <div class="upload-status" id="backupRestoreStatus"></div>
                    </div>
                </aside>

                <!-- 右側主要內容展示區 -->
                <div class="content-area">
                    <div class="content-header">
                        <div class="title-group">
                            <h2 id="currentBookTitle">全部書籍</h2>
                            <span class="badge" id="clippingsCount">共 0 則紀錄</span>
                        </div>
                        <div class="header-action-group">
                            <button type="button" id="exportMdBtn" class="btn-action">選取標注複製至剪貼簿</button>
                            <button type="button" id="downloadAllMdBtn" class="btn-action btn-download">匯出完整資料庫Markdown</button>
                        </div>
                    </div>

                    <!-- 批次操作工具列 -->
                    <div class="batch-bar">
                        <div class="batch-select-group">
                            <input type="checkbox" id="selectAllCheckbox">
                            <label for="selectAllCheckbox">全選目前頁面標註</label>
                            <span class="selected-text" id="selectedCountText">已選取 0 則</span>
                        </div>
                        <button type="button" id="batchDeleteBtn" class="btn-batch-delete" disabled>批次刪除選取項目</button>
                    </div>

                    <!-- 標註卡片清單網格 -->
                    <div class="cards-grid" id="cardsContainer">
                        <!-- 由 JavaScript 動態生成標註卡片 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 書籍心得清單分頁 -->
        <section id="booksTab" class="tab-content">
            <div class="books-overview-area">
                <div class="content-header">
                    <div class="title-group">
                        <h2>書籍心得與備註總覽</h2>
                        <span class="badge" id="booksOverviewCount">共 0 本書籍</span>
                    </div>
                </div>

                <!-- 書籍心得卡片清單 -->
                <div class="book-notes-container" id="bookNotesList">
                    <!-- 由 JavaScript 動態生成書籍心得卡片 -->
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
